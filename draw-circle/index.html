<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>원 완벽하게 그리기</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --amber:#FFB800; --green:#12B76A; --red:#FF4D4D; --muted:#6B6B6B;
    --point:#3D5AFE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Malgun Gothic',sans-serif;
    background:var(--paper);
    background-image:radial-gradient(var(--ink) .5px, transparent .5px);
    background-size:22px 22px;
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;
    overflow:hidden;
    touch-action:manipulation;
  }
  a.home{
    position:fixed;top:12px;left:12px;z-index:20;
    text-decoration:none;color:var(--ink);
    background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;
    box-shadow:3px 3px 0 var(--ink);
    min-height:44px;display:inline-flex;align-items:center;
  }
  a.home:active{transform:translate(3px,3px);box-shadow:none;}
  .wrap{
    width:100%;max-width:560px;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:64px 12px 12px;
    position:relative;
  }
  h1{font-size:clamp(24px,7vw,40px);font-weight:900;letter-spacing:-.03em;margin:0 0 6px;text-align:center;}
  .lead{color:var(--muted);font-weight:600;text-align:center;margin:0 0 18px;font-size:15px;}
  canvas{
    background:var(--surface);
    border:3px solid var(--ink);
    border-radius:20px;
    box-shadow:5px 5px 0 var(--ink);
    touch-action:none;
    display:block;
    cursor:crosshair;
    width:100%;
    max-width:520px;
    aspect-ratio:1/1;
  }
  .panel{
    position:absolute;inset:64px 12px 12px;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;
    background:transparent;
    pointer-events:none;
  }
  .panel.show{display:flex;pointer-events:auto;}
  .card{
    background:var(--surface);border:3px solid var(--ink);border-radius:20px;
    box-shadow:5px 5px 0 var(--ink);
    padding:26px 22px;max-width:420px;width:100%;
  }
  .kicker{
    display:inline-block;border:2.5px solid var(--ink);border-radius:999px;
    padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;background:var(--amber);margin-bottom:12px;
  }
  .score{font-size:clamp(44px,16vw,80px);font-weight:900;line-height:1;letter-spacing:-.03em;}
  .stars{font-size:30px;letter-spacing:4px;margin:6px 0;}
  .msg{font-weight:700;font-size:17px;margin:4px 0;}
  .sub{color:var(--muted);font-weight:600;font-size:14px;}
  .best{color:var(--point);font-weight:800;font-size:15px;margin-top:6px;}
  button{
    font-family:inherit;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;
    background:var(--amber);color:var(--ink);
    font-weight:800;font-size:18px;padding:14px 26px;
    box-shadow:3px 3px 0 var(--ink);
    min-height:52px;min-width:120px;
    margin-top:6px;
  }
  button:active{transform:translate(3px,3px);box-shadow:none;}
  button.ghost{background:var(--surface);}
  .hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:var(--muted);font-weight:600;font-size:13px;pointer-events:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<a class="home" href="../">← 수업터 홈</a>

<div class="wrap">
  <h1>원 완벽하게 그리기</h1>
  <p class="lead">드로잉봇처럼 중심점 둘레로 한 번에 원을!</p>
  <canvas id="cv" width="520" height="520" aria-label="원 그리기 캔버스"></canvas>

  <!-- 시작 화면 -->
  <div class="panel show" id="startPanel">
    <div class="card">
      <span class="kicker">드로잉봇 챌린지</span>
      <div class="msg">가운데 점 둘레로 원을 그려요</div>
      <p class="sub">마우스나 손가락으로 한 번에 쭉!<br>자도 격자도 없어요. 오직 감으로.<br>얼마나 완벽한 원인지 점수가 나와요.</p>
      <div class="best" id="startBest"></div>
      <button id="startBtn">시작</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="panel" id="resultPanel">
    <div class="card">
      <span class="kicker">결과</span>
      <div class="score"><span id="scoreVal">0</span>%</div>
      <div class="stars" id="starsVal">☆☆☆</div>
      <div class="msg" id="resultMsg">잘했어요!</div>
      <div class="best" id="resultBest"></div>
      <button id="againBtn">다시</button>
    </div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script>
(function(){
  "use strict";

  var BEST_KEY = "robotlab_draw_circle_best";
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var startPanel = document.getElementById("startPanel");
  var resultPanel = document.getElementById("resultPanel");
  var startBtn = document.getElementById("startBtn");
  var againBtn = document.getElementById("againBtn");
  var scoreVal = document.getElementById("scoreVal");
  var starsVal = document.getElementById("starsVal");
  var resultMsg = document.getElementById("resultMsg");
  var resultBest = document.getElementById("resultBest");
  var startBest = document.getElementById("startBest");
  var hint = document.getElementById("hint");

  var W = cv.width, H = cv.height;
  var cx = W/2, cy = H/2;

  var STATE_START = 0, STATE_DRAW = 1, STATE_RESULT = 2;
  var state = STATE_START;

  var drawing = false;
  var pts = [];          // {x,y}
  var raf = null;

  // ---- 최고점수 로드/저장 (try/catch 필수) ----
  function loadBest(){
    try { return Number(localStorage.getItem(BEST_KEY) || 0) || 0; }
    catch(e){ return 0; }
  }
  function saveBest(v){
    try { localStorage.setItem(BEST_KEY, String(v)); } catch(e){}
  }

  // ---- 점수 계산 (분리 가능한 순수 함수) ----
  // 그린 점들의 중심으로부터 반지름 표준편차/평균으로 정확도 계산.
  // 한 바퀴(각도 커버리지)를 돌았는지 확인해 페널티.
  function scoreCircle(points, centerX, centerY){
    if(!points || points.length < 8) return {score:0, coverage:0, valid:false};

    // 실제 그린 점들의 무게중심 사용 (안내 중심과 별개로 모양 자체 평가)
    var gx=0, gy=0, i;
    for(i=0;i<points.length;i++){ gx+=points[i].x; gy+=points[i].y; }
    gx/=points.length; gy/=points.length;

    // 반지름 평균/표준편차
    var radii = [];
    var sum=0;
    for(i=0;i<points.length;i++){
      var dx=points[i].x-gx, dy=points[i].y-gy;
      var r=Math.sqrt(dx*dx+dy*dy);
      radii.push(r); sum+=r;
    }
    var mean = sum/radii.length;
    if(mean < 8) return {score:0, coverage:0, valid:false};

    var vs=0;
    for(i=0;i<radii.length;i++){ var d=radii[i]-mean; vs+=d*d; }
    var std = Math.sqrt(vs/radii.length);
    var cv_ = std/mean; // 변동계수 (0=완벽)

    // 각도 커버리지: 그린 점들이 몇 도를 덮었는지 (16 섹터 채움 비율)
    var SECT = 16;
    var filled = new Array(SECT);
    for(i=0;i<SECT;i++) filled[i]=false;
    for(i=0;i<points.length;i++){
      var a = Math.atan2(points[i].y-gy, points[i].x-gx); // -PI..PI
      var idx = Math.floor((a+Math.PI)/(2*Math.PI)*SECT);
      if(idx<0) idx=0; if(idx>=SECT) idx=SECT-1;
      filled[idx]=true;
    }
    var fc=0;
    for(i=0;i<SECT;i++){ if(filled[i]) fc++; }
    var coverage = fc/SECT; // 0..1

    // 정확도: 변동계수를 0~100 으로. cv 0 → 100, cv 0.35 이상 → 0
    var acc = 100 * (1 - cv_/0.35);
    if(acc<0) acc=0; if(acc>100) acc=100;

    // 커버리지 페널티: 한 바퀴를 덜 돌면 크게 깎임
    var score = acc * Math.pow(coverage, 1.5);

    // 시작-끝이 벌어졌으면 약간 감점
    var sp = points[0], ep = points[points.length-1];
    var gapRaw = Math.sqrt((sp.x-ep.x)*(sp.x-ep.x)+(sp.y-ep.y)*(sp.y-ep.y));
    var gapRatio = gapRaw/mean;
    if(gapRatio > 0.5){
      var pen = Math.min(1, (gapRatio-0.5)/1.5);
      score *= (1 - 0.4*pen);
    }

    score = Math.round(score);
    if(score<0) score=0; if(score>100) score=100;
    var valid = coverage >= 0.7; // 최소 70% 이상 덮어야 유효한 한 바퀴
    return {score:score, coverage:coverage, valid:valid, mean:mean, gx:gx, gy:gy};
  }

  function starsFor(s){
    if(s>=95) return "★★★";
    if(s>=90) return "★★☆";
    if(s>=75) return "★☆☆";
    return "☆☆☆";
  }
  function msgFor(s){
    if(s>=98) return "믿을 수 없어요! 완벽한 원!";
    if(s>=90) return "굉장해요! 거의 완벽!";
    if(s>=75) return "훌륭한 원이에요!";
    if(s>=50) return "좋아요! 조금만 더 둥글게!";
    return "괜찮아요, 다시 도전!";
  }

  // ---- 그리기 ----
  function drawGuide(){
    ctx.clearRect(0,0,W,H);
    // 안내 링 (연한 점선) — 참고만
    ctx.save();
    ctx.strokeStyle = "rgba(61,90,254,0.18)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(W,H)*0.32, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
    // 중심점
    ctx.save();
    ctx.fillStyle = "#141414";
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#3D5AFE";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawStroke(){
    if(pts.length<2) return;
    ctx.save();
    ctx.strokeStyle = "#141414";
    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(var i=1;i<pts.length;i++){ ctx.lineTo(pts[i].x, pts[i].y); }
    ctx.stroke();
    ctx.restore();
  }

  function render(){
    drawGuide();
    drawStroke();
    raf = requestAnimationFrame(render);
  }
  function startRender(){
    if(!raf) raf = requestAnimationFrame(render);
  }
  function stopRender(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    // 마지막 프레임 한 번 고정으로 남김
    drawGuide();
    drawStroke();
  }

  // ---- 좌표 변환 ----
  function getPos(e){
    var rect = cv.getBoundingClientRect();
    var clientX, clientY;
    if(e.touches && e.touches.length){
      clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX; clientY = e.clientY;
    }
    var x = (clientX - rect.left) / rect.width * W;
    var y = (clientY - rect.top) / rect.height * H;
    return {x:x, y:y};
  }

  function beginDraw(e){
    if(state !== STATE_DRAW) return;
    e.preventDefault();
    drawing = true;
    pts = [];
    var p = getPos(e);
    pts.push(p);
    startRender();
  }
  function moveDraw(e){
    if(!drawing || state !== STATE_DRAW) return;
    e.preventDefault();
    var p = getPos(e);
    var last = pts[pts.length-1];
    // 너무 촘촘한 점은 건너뛰어 성능/안정성 확보
    if(!last || Math.abs(p.x-last.x)+Math.abs(p.y-last.y) > 1.2){
      pts.push(p);
    }
  }
  function endDraw(e){
    if(!drawing) return;
    e.preventDefault();
    drawing = false;
    stopRender();
    finishStroke();
  }

  function finishStroke(){
    var res = scoreCircle(pts, cx, cy);
    var s = res.score;
    if(!res.valid){
      // 한 바퀴를 못 돌았으면 안내
      showResult(s, true);
    } else {
      showResult(s, false);
    }
  }

  function showResult(s, incomplete){
    state = STATE_RESULT;
    scoreVal.textContent = s;
    starsVal.textContent = starsFor(s);
    if(incomplete){
      resultMsg.textContent = "한 바퀴를 다 돌아야 해요!";
    } else {
      resultMsg.textContent = msgFor(s);
    }
    var best = loadBest();
    if(!incomplete && s > best){
      best = s;
      saveBest(best);
      resultBest.textContent = "새 최고 기록! 🏆 " + best + "%";
    } else {
      resultBest.textContent = best>0 ? ("최고 기록: " + best + "%") : "";
    }
    resultPanel.classList.add("show");
    hint.textContent = "";
  }

  function goDraw(){
    state = STATE_DRAW;
    pts = [];
    drawing = false;
    startPanel.classList.remove("show");
    resultPanel.classList.remove("show");
    drawGuide();
    hint.textContent = "가운데 점 둘레로 원을 한 번에 그려요";
  }

  function goStart(){
    state = STATE_START;
    var best = loadBest();
    startBest.textContent = best>0 ? ("최고 기록: " + best + "%") : "";
    startPanel.classList.add("show");
    resultPanel.classList.remove("show");
    drawGuide();
    hint.textContent = "";
  }

  // ---- 이벤트 ----
  startBtn.addEventListener("click", goDraw);
  againBtn.addEventListener("click", goDraw);

  cv.addEventListener("mousedown", beginDraw);
  window.addEventListener("mousemove", moveDraw);
  window.addEventListener("mouseup", endDraw);

  cv.addEventListener("touchstart", beginDraw, {passive:false});
  cv.addEventListener("touchmove", moveDraw, {passive:false});
  cv.addEventListener("touchend", endDraw, {passive:false});
  cv.addEventListener("touchcancel", endDraw, {passive:false});

  // 탭 비활성 시 렌더 멈춤
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ stopRender(); }
    else if(state===STATE_DRAW && drawing){ startRender(); }
  });

  // 초기화
  goStart();

})();
</script>
</body>
</html>
